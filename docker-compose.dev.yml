version: "3.8"

services:
  # Backend Laravel — modo dev com hot reload
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # código local mapeado
      - /app/vendor             # vendor isolado no container (não sobrescreve)
    depends_on:
      - db
    environment:
      - APP_ENV=local
    # Roda o artisan com --reload via watchexec
    command: sh -c "sleep 5 && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  # Banco de dados PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bus_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: masterkey
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Frontend React — modo dev com Vite (hot reload real)
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         # código local mapeado
      - /app/node_modules       # node_modules isolado no container
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data: