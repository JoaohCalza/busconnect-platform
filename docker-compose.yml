version: "3.8"

services:
  # Backend Laravel
  backend:
    build: ./backend
    ports:
      - "8000:8000"          # Laravel rodando no localhost:8000
    volumes:
      - ./backend:/app       # Mapeia código local
      - ./backend/vendor:/app/vendor
    depends_on:
      - db

  # Banco de dados PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bus_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: masterkey
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Frontend React
  frontend:
    build: ./frontend
    ports:
      - "5173:80"            # React servido pelo Nginx em localhost:5173
    depends_on:
      - backend

volumes:
  postgres_data: